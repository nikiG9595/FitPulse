<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('User Management')}"></head>
<body class="page-bg">
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-title">
        <h1>User Management</h1>
        <p>Review registered users and manage their access roles.</p>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="fit-card table-responsive">
        <table class="table align-middle mb-0">
            <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Current role</th>
                <th>Change role</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.username}">username</td>
                <td th:text="${user.email}">email@example.com</td>
                <td><span class="badge text-bg-dark" th:text="${user.role}">MEMBER</span></td>
                <td>
                    <form class="d-flex gap-2" th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post">
                        <select class="form-select" name="role" aria-label="New role">
                            <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"
                                    th:selected="${role == user.role}"></option>
                        </select>
                        <button class="btn btn-pulse" type="submit">Update</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
