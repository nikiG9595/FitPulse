<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit Profile')}"></head>
<body class="page-bg">
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page narrow">
    <div class="fit-card">
        <h1>Edit Profile</h1>
        <p class="text-muted">Update your account details.</p>

        <div th:if="${globalError}" class="alert alert-danger" th:text="${globalError}"></div>

        <form th:action="@{/profile/edit}" th:object="${profileUpdateRequest}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" class="form-control" th:field="*{username}">
                <div class="text-danger small" th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-control" th:field="*{email}">
                <div class="text-danger small" th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"></div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-pulse" type="submit">Save Changes</button>
                <a href="/profile" class="btn btn-outline-dark">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
