<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Progress Record')}"></head>
<body class="page-bg">
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page narrow">
    <div class="fit-card">
        <h1 th:text="${progressId == null ? 'Add Progress Record' : 'Edit Progress Record'}">Progress Record</h1>
        <p class="text-muted">Record your current measurements.</p>

        <div class="alert alert-danger" role="alert" th:if="${globalError}" th:text="${globalError}"></div>

        <form th:action="${progressId} == null ? @{/progress/create} : @{/progress/{id}/edit(id=${progressId})}"
              th:object="${progressFormRequest}" method="post">
            <label class="form-label mt-3" for="weight">Weight (kg)</label>
            <input class="form-control" id="weight" type="number" min="20" max="400" step="0.1" th:field="*{weight}">
            <div class="field-error" th:errors="*{weight}"></div>

            <label class="form-label mt-3" for="bodyFatPercentage">Body Fat (%) <span class="text-muted">optional</span></label>
            <input class="form-control" id="bodyFatPercentage" type="number" min="1" max="80" step="0.1"
                   th:field="*{bodyFatPercentage}">
            <div class="field-error" th:errors="*{bodyFatPercentage}"></div>

            <label class="form-label mt-3" for="recordedAt">Date</label>
            <input class="form-control" id="recordedAt" type="date" th:field="*{recordedAt}">
            <div class="field-error" th:errors="*{recordedAt}"></div>

            <label class="form-label mt-3" for="note">Note <span class="text-muted">optional</span></label>
            <textarea class="form-control" id="note" rows="4" maxlength="500" th:field="*{note}"></textarea>
            <div class="field-error" th:errors="*{note}"></div>

            <button class="btn btn-pulse w-100 mt-4" type="submit">Save</button>
            <a class="btn btn-outline-secondary w-100 mt-2" th:href="@{/progress}">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
