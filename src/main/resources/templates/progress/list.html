<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('My Progress')}"></head>
<body class="page-bg">
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page">
    <div class="page-title d-flex justify-content-between align-items-center">
        <div>
            <h1>My Progress</h1>
            <p>Track your weight and body composition over time.</p>
        </div>
        <a class="btn btn-pulse" th:href="@{/progress/create}">Add Record</a>
    </div>

    <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <div class="fit-card" th:if="${#lists.isEmpty(progressRecords)}">
        No progress records yet. <a class="link-pulse" th:href="@{/progress/create}">Add your first record</a>.
    </div>

    <div class="fit-card p-0 overflow-hidden" th:unless="${#lists.isEmpty(progressRecords)}">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Weight</th>
                    <th>Body Fat</th>
                    <th>Note</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="record : ${progressRecords}">
                    <td th:text="${#temporals.format(record.recordedAt, 'dd MMM yyyy')}"></td>
                    <td><span th:text="${record.weight}"></span> kg</td>
                    <td th:text="${record.bodyFatPercentage == null ? '—' : record.bodyFatPercentage + '%'}"></td>
                    <td th:text="${#strings.isEmpty(record.note) ? '—' : record.note}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/progress/{id}/edit(id=${record.id})}">Edit</a>
                        <form class="d-inline" th:action="@{/progress/{id}/delete(id=${record.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
