spring.application.name=FitPulse
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/fitpulse?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root123.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# Scheduling
fitpulse.scheduling.expired-bookings-cron=0 0 * * * *
fitpulse.scheduling.past-classes-delay-ms=300000

progress.service.url=http://localhost:8081
spring.cloud.openfeign.client.config.progress-service.connectTimeout=3000
spring.cloud.openfeign.client.config.progress-service.readTimeout=5000
