spring.datasource.url=jdbc:h2:mem:fitpulse-integration;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable the cron job and keep the fixed-delay cleanup from recurring during the test.
fitpulse.scheduling.expired-bookings-cron=-
fitpulse.scheduling.past-classes-delay-ms=86400000

# The Feign client is mocked in the integration test, but its URL must still resolve
# while the real application context is created.
progress.service.url=http://localhost:1
